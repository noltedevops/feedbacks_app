# Credentials come from .env, which is gitignored - nothing secret belongs in this
# file, since it is committed. The :? form fails the command with that message when
# a value is missing, rather than quietly falling back to a well-known default.
#
# Both services publish to 127.0.0.1 only. They are reached from this machine (the
# API over DATABASE_URL, pgAdmin in a browser), so binding them to every interface
# only offered the database to the rest of the network.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: feedback_postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # initdb otherwise writes "trust" for local and 127.0.0.1 connections, so any
      # process inside this container reaches the database as superuser without a
      # password. The running volume has been corrected in place; this is what a
      # freshly created volume needs so it does not come back up trusting.
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Without this the database does not come back after a reboot or a Docker
    # restart, and the app - which is not managed here - fails against nothing.
    restart: unless-stopped
    # $$ keeps compose from interpolating these: they are expanded by the shell
    # inside the container, where the POSTGRES_* values already exist.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nolte-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    # service_started only waits for the container to exist; pgAdmin would come
    # up against a database still running initdb. Wait for the healthcheck.
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
