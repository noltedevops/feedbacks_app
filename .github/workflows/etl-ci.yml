name: ETL Pipeline & UI CI

on:
  push:
    branches: [ main ]
    paths:
      - 'etl/**'
      - 'frontend/**'
      - 'server.py'
      - 'models.py'
      - 'database.py'
      - '.github/workflows/etl-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'etl/**'
      - 'frontend/**'
      - 'server.py'
      - 'models.py'
      - 'database.py'
      - '.github/workflows/etl-ci.yml'

jobs:
  etl-lint-and-test:
    name: ETL Validation & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests pydantic psycopg[binary]

      - name: Validate ETL Configuration Linting
        run: |
          python etl/runner/run.py validate-config

      - name: Run ETL Validation & Webhook Alert Unit Tests
        run: |
          python -m unittest etl/tests/test_validation_and_alerts.py

      - name: Run ETL Runner Robustness Unit Tests
        run: |
          python -m unittest etl/tests/test_runner_robustness.py

  frontend-lint-and-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint ETL Panel & App Code
        working-directory: ./frontend
        run: npx eslint src/components/EtlPanel.tsx

      - name: TypeScript Compile & Vite Build
        working-directory: ./frontend
        run: npm run build
