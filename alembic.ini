# Schema migrations for public.* (the app's tables). The server applies them at startup
# through database.init_db(); the CLI is for writing new ones:
#   alembic revision --autogenerate -m "add x to y"     review it, then commit it
#   alembic current | alembic history
# The database is the one DATABASE_URL names (database.py), never a URL in this file.
# The ETL's schemas (etl, etl_approval, etl_admin) are set up by `etl/runner/run.py
# setup-sql`, not here.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
